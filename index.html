<!DOCTYPE html>
<html lang="ja">
<head>

  <meta name="theme-color" content="#06b35a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Chatone" />
  <meta name="description" content="Chatone — kintone チャットアプリ" />

  <title>Chatone</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon-192.png" />

</head>
<body>

  <!-- スプラッシュ（起動中に表示） -->
  <div id="splash" class="co-splash">
    <div class="co-splash-inner">
      <div class="co-splash-icon"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
      <div class="co-splash-title">Chatone</div>
      <div class="co-splash-status" id="splash-status">起動中…</div>
    </div>
  </div>

  <!-- アプリ本体ルート（JS が書き換える） -->
  <div id="app-root"></div>

  <!-- Firebase SDK (compat 版) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>

  <!-- Chatone PWA メインスクリプト -->
  <script src="chatone-pwa.js"></script>
  <script src="chatone-pwa-hotfix.js?v=20260629-5"></script>

</html>
